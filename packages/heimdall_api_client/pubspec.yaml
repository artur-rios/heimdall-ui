name: heimdall_api_client
description: >-
  Dart client for the Heimdall API, generated from its OpenAPI specification by
  swagger_parser. Everything under lib/ is generated output — regenerate it with
  `dart run swagger_parser` from the repository root rather than editing it.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.11.0
  json_annotation: ^4.12.0
  retrofit: ^4.9.2

dev_dependencies:
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
