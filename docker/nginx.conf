# Serves the Flutter web build. Installed as /etc/nginx/conf.d/default.conf in
# nginxinc/nginx-unprivileged, whose nginx.conf supplies the http block.
#
# TLS is terminated by Traefik in front of this container, so this server
# speaks plain HTTP on 8080 and leaves HSTS to the proxy.
#
# @HEIMDALL_API_ORIGIN@ below is replaced at image build time with the origin
# of HEIMDALL_API_BASE_URL (see the Dockerfile); served as it is, the file is
# not a working configuration.

# Referrer-Policy: a password-reset or verify-email page is opened with its
# token in the URL. Start-up removes it from the address, but the page's own
# scripts and assets are requested before that, and would carry it in their
# Referer, so those two documents send none at all. Everywhere else the
# browser default stays: Google Identity Services asks for
# strict-origin-when-cross-origin, and `same-origin` would send it nothing.
# $request_uri, because try_files rewrites $uri to /index.html.
map $request_uri $heimdall_referrer_policy {
    default                                            "strict-origin-when-cross-origin";
    "~^[^?]*/(password-reset|verify-email)/?(\?|$)"    "no-referrer";
}

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    server_tokens      off;
    # Redirects must stay relative: the client reached us over HTTPS on 443
    # through Traefik, not on http://<host>:8080.
    absolute_redirect  off;

    # Types: application/wasm is already mapped by the image's mime.types; .mjs
    # is not. A `types` block here would replace the inherited map outright,
    # so the stock map is re-included first and .mjs is added to it.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json application/wasm
                      image/svg+xml font/ttf font/otf application/x-font-ttf;

    # Liveness probe for the Docker HEALTHCHECK; not logged to keep the access
    # log about real traffic.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        add_header   Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Caching: Flutter emits stable, un-hashed file names (main.dart.js,
    # flutter_bootstrap.js, assets/*, canvaskit/*), so no file can safely be
    # cached as immutable - a long max-age would pin users to a stale build.
    # Every response is therefore `no-cache`: browsers keep a copy but
    # revalidate it with the ETag / Last-Modified validators nginx emits, which
    # costs a 304 round trip per file instead of a full download. This covers
    # index.html, flutter_bootstrap.js, flutter_service_worker.js,
    # version.json and manifest.json as well as everything else.
    #
    # Content-Security-Policy, enforced. What each source is for:
    #   script-src  'wasm-unsafe-eval' compiles CanvasKit's (or skwasm's)
    #               WebAssembly; the gsi/client script is Google Sign-In's.
    #   style-src   the engine and Google Sign-In inject <style> elements, and
    #               gsi/style is Google Sign-In's stylesheet.
    #   connect-src the API's origin, which is the page's own on the VPS and
    #               another one locally; gsi/ is Google Sign-In's endpoints;
    #               googleusercontent.com serves Google profile pictures,
    #               which the engine fetches.
    #   img-src     data: images, and Google profile pictures shown as <img>.
    #   frame-src   the Google Sign-In button and its prompts are iframes.
    # Verified against release builds (CanvasKit and --wasm/skwasm) with
    # Google Sign-In and an API on another origin, with no violation; read
    # "Security headers" in the operations document before widening it.
    #
    # add_header is not inherited into a location that declares its own, so
    # the security headers live in the same block as Cache-Control.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control           "no-cache" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Referrer-Policy         $heimdall_referrer_policy always;
        add_header X-Frame-Options         "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' @HEIMDALL_API_ORIGIN@ https://accounts.google.com/gsi/ https://*.googleusercontent.com; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
