include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "packages/heimdall_api_client/lib/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - web/**
    - windows/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - close_sinks
    - directives_ordering
    - discarded_futures
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
