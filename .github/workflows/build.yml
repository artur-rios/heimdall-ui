name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No API base URL is supplied on purpose: the default keeps a deployment
      # address out of a public build log.
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: heimdall-ui-web
          path: build/web

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          # libsecret-1-dev is not part of Flutter's generic desktop list: it is
          # flutter_secure_storage_linux's own dependency, and the session token
          # lives in libsecret, so it is not optional here.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: heimdall-ui-linux
          path: build/linux/x64/release/bundle

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # flutter_secure_storage_windows includes atlstr.h, so the runner's
      # Visual Studio installation must carry the C++ ATL component.
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: heimdall-ui-windows
          path: build/windows/x64/runner/Release

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed with the debug key: suitable for testing, never for release.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: heimdall-ui-android
          path: build/app/outputs/flutter-apk/*.apk
