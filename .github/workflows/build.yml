name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No API base URL is supplied on purpose: the default keeps a deployment
      # address out of a public build log.
      - run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: heimdall-ui-web
          path: build/web

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          # libsecret-1-dev is not part of Flutter's generic desktop list: it is
          # flutter_secure_storage_linux's own dependency, and the session token
          # lives in libsecret, so it is not optional here.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: heimdall-ui-linux
          path: build/linux/x64/release/bundle

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # flutter_secure_storage_windows includes atlstr.h, so the runner's
      # Visual Studio installation must carry the C++ ATL component.
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: heimdall-ui-windows
          path: build/windows/x64/runner/Release

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.HEIMDALL_UI_KEYSTORE_BASE64 }}
      HEIMDALL_UI_KEYSTORE_PASSWORD: ${{ secrets.HEIMDALL_UI_KEYSTORE_PASSWORD }}
      HEIMDALL_UI_KEY_ALIAS: ${{ secrets.HEIMDALL_UI_KEY_ALIAS }}
      HEIMDALL_UI_KEY_PASSWORD: ${{ secrets.HEIMDALL_UI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The keystore comes from repository secrets. Unset secrets are empty
      # strings, which the Gradle build treats as unset, so a build without them
      # (a fork, a pull request, a repository not set up yet) still passes, signed
      # with the debug key.
      - name: Restore the release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/heimdall-ui-release.jks"
          echo "HEIMDALL_UI_KEYSTORE_PATH=$RUNNER_TEMP/heimdall-ui-release.jks" >> "$GITHUB_ENV"
      - name: Note the signing key
        id: signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Android APK signed with the debug key::No release keystore secret is set, so this APK is signed with the debug key. Do not distribute it."
            echo "suffix=-debug-signed" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release
      # Flutter grants INTERNET to debug and profile builds only, so a release APK
      # can lose it unnoticed: it installs, and then every request fails.
      - name: Check the release APK can reach the network
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/permissions.txt"
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt" \
            || { echo "::error title=INTERNET permission missing::The release APK does not declare android.permission.INTERNET."; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: heimdall-ui-android${{ steps.signing.outputs.suffix }}
          path: build/app/outputs/flutter-apk/*.apk
