version: 2

# Dependency update pull requests. Every pull request targets develop: main only receives release/*
# pull requests (CONTRIBUTING.md), and the branch-policy workflow accepts dependabot/* heads into
# develop.

updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # packages/*_api_client is generated (tool/generate_api_client.dart) and pins what the
    # generator emits, so only the application pubspec is updated here.

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
